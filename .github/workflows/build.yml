name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Zipni ochish
        run: unzip -q blokhub.zip -d src
      - name: APK yig'ish
        working-directory: src/bedrock-android
        run: gradle assembleDebug
      - name: APK nomini tayyorlash
        run: cp src/bedrock-android/app/build/outputs/apk/debug/app-debug.apk BlokHub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BlokHub v${{ github.run_number }}
          files: BlokHub.apk
