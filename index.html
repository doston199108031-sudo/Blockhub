.guide { margin-top: 20px; }

.note { margin-top: 16px; color: var(--muted); font-size: 14px; max-width: 64ch; }

footer { border-top: 1px solid var(--line); padding-block: 28px 40px; color: var(--muted); font-size: 13px; }

Object.keys(X).forEach(function (l) { Object.keys(X[l]).forEach(function (k) { T[l][k] = X[l][k]; }); });

var N = window.BlokHubNative || null;
var PRESETS = ["Q", "F5", "F1", "F3", "E", "T", "F11"];
var cfg = { buttons: [mk("Q", 0.92, 0.2), mk("F5", 0.92, 0.38), mk("F1", 0.92, 0.56)] };
var sel = null, drag = null, saveT = 0;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function mk(key, x, y) { return { id: "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), label: key, key: key, x: x, y: y, size: 52, opacity: 0.75 }; }
function loadCfg() {
  var raw = "";
  try { raw = N ? N.getConfig() : (localStorage.getItem("blokhub-cfg") || ""); } catch (e) {}
  try { var c = JSON.parse(raw); if (c && Array.isArray(c.buttons)) cfg = c; } catch (e) {}
}
function saveCfg() {
  clearTimeout(saveT);
  saveT = setTimeout(function () {
    var s = JSON.stringify(cfg);
    try { if (N) N.saveConfig(s); else localStorage.setItem("blokhub-cfg", s); } catch (e) {}
  }, 150);
}
function selBtn() { for (var i = 0; i < cfg.buttons.length; i++) if (cfg.buttons[i].id === sel) return cfg.buttons[i]; return null; }

function showM(m) { m.hidden = false; document.body.style.overflow = "hidden"; }
function hideAll() { $("pickModal").hidden = true; $("setModal").hidden = true; document.body.style.overflow = ""; }

function renderPick() {
  var d = T[lang], box = $("games"); box.replaceChildren();
  var list = [];
  try { list = N ? JSON.parse(N.games()) : []; } catch (e) {}
  list.forEach(function (g) {
    var b = el("button", "game"); b.type = "button";
    b.appendChild(el("span", null, g.name));
    b.appendChild(el("small", null, g.installed ? "" : d.not_inst));
    b.addEventListener("click", function () { hideAll(); try { N.play(g.pkg); } catch (e) {} });
    box.appendChild(b);
  });
}
function openPick() { renderPick(); showM($("pickModal")); }

function renderStat() {
  var d = T[lang], box = $("stat"); box.replaceChildren();
  if (!N) return;
  var s = {};
  try { s = JSON.parse(N.status()); } catch (e) {}
  [[d.perm_overlay, s.overlay, "grantOverlay"], [d.perm_keys, s.keys, "grantShizuku"]].forEach(function (r) {
    var row = el("div", "stat"); row.appendChild(el("span", null, r[0]));
    if (r[1]) row.appendChild(el("b", "okk", d.on));
    else {
      var b = el("button", "btn", d.grant); b.type = "button";
      b.addEventListener("click", function () { try { N[r[2]](); } catch (e) {} });
      row.appendChild(b);
    }
    box.appendChild(row);
  });
  box.appendChild(el("p", "note", d.keys_note));
}

function styleBtn(n, b) {
  var k = $("pv").clientWidth / 760, s = Math.max(22, b.size * k);
  n.style.width = s + "px"; n.style.height = s + "px";
  n.style.left = (b.x * 100) + "%"; n.style.top = (b.y * 100) + "%";
  n.style.opacity = b.opacity; n.style.fontSize = Math.max(10, s * 0.3) + "px";
  n.textContent = b.label;
  n.classList.toggle("on", b.id === sel);
}
function nodeOf(id) { var c = $("pv").children; for (var i = 0; i < c.length; i++) if (c[i].dataset.id === id) return c[i]; return null; }
function markSel() { cfg.buttons.forEach(function (b) { var n = nodeOf(b.id); if (n) n.classList.toggle("on", b.id === sel); }); }

function renderPv() {
  var pv = $("pv"); pv.replaceChildren();
  cfg.buttons.forEach(function (b) {
    var n = el("div", "pb"); n.dataset.id = b.id;
    n.addEventListener("pointerdown", function (e) {
      e.preventDefault(); n.setPointerCapture(e.pointerId);
      drag = b; sel = b.id; markSel(); renderEditor();
    });
    n.addEventListener("pointermove", function (e) {
      if (drag !== b) return;
      var r = pv.getBoundingClientRect();
      b.x = clamp((e.clientX - r.left) / r.width, 0.03, 0.97);
      b.y = clamp((e.clientY - r.top) / r.height, 0.05, 0.95);
      styleBtn(n, b);
    });
    var end = function () { if (drag === b) { drag = null; saveCfg(); } };
    n.addEventListener("pointerup", end); n.addEventListener("pointercancel", end);
    pv.appendChild(n); styleBtn(n, b);
  });
}

function renderChips() {
  var d = T[lang], box = $("chips"); box.replaceChildren();
  PRESETS.forEach(function (k) {
    var c = el("button", "chip", k + " \u00B7 " + d.pd[k]); c.type = "button";
    c.addEventListener("click", function () { addBtn(k); });
    box.appendChild(c);
  });
  $("customKey").placeholder = d.add_custom;
}
function addBtn(key) {
  key = (key || "").trim().toUpperCase().replace(/[^A-Z0-9_]/g, "").slice(0, 16);
  if (!key || cfg.buttons.length >= 16) return;
  var n = cfg.buttons.length;
  var b = mk(key, clamp(0.5 + (n % 5) * 0.06, 0.05, 0.95), clamp(0.3 + (n % 6) * 0.08, 0.1, 0.9));
  cfg.buttons.push(b); sel = b.id;
  renderPv(); renderEditor(); saveCfg();
}

function rangeField(text, min, max, val, unit, fn) {
  var l = el("label"), sp = el("span", null, text + ": " + val + unit);
  var i = el("input"); i.type = "range"; i.min = min; i.max = max; i.value = val;
  i.addEventListener("input", function () { sp.textContent = text + ": " + i.value + unit; fn(+i.value); });
  l.appendChild(sp); l.appendChild(i); return l;
}
function textField(text, val, max, fn) {
  var l = el("label"); l.appendChild(el("span", null, text));
  var i = el("input"); i.type = "text"; i.value = val; i.maxLength = max; i.autocapitalize = "off";
  i.addEventListener("input", function () { fn(i); });
  l.appendChild(i); return l;
}
function renderEditor() {
  var d = T[lang], box = $("editor"), b = selBtn(); box.replaceChildren();
  if (!b) { box.appendChild(el("p", "note", d.none_sel)); return; }
  var upd = function () { var n = nodeOf(b.id); if (n) styleBtn(n, b); saveCfg(); };
  box.appendChild(el("h3", null, d.sel_h));
  var ed = el("div", "ed"), labelInput = null;
  var kf = textField(d.key, b.key, 16, function (i) {
    var old = b.key;
    b.key = i.value.toUpperCase().replace(/[^A-Z0-9_]/g, "");
    if (b.label === old && labelInput) { b.label = b.key.slice(0, 5); labelInput.value = b.label; }
    upd();
  });
  var lf = textField(d.label, b.label, 5, function (i) { b.label = i.value; upd(); });
  labelInput = lf.querySelector("input");
  ed.appendChild(kf); ed.appendChild(lf);
  ed.appendChild(rangeField(d.size, 28, 120, Math.round(b.size), " dp", function (v) { b.size = v; upd(); }));
  ed.appendChild(rangeField(d.opac, 10, 100, Math.round(b.opacity * 100), "%", function (v) { b.opacity = v / 100; upd(); }));
  var del = el("button", "btn danger", d.del); del.type = "button";
  del.addEventListener("click", function () {
    cfg.buttons = cfg.buttons.filter(function (x) { return x.id !== b.id; });
    sel = null; renderPv(); renderEditor(); saveCfg();
  });
  ed.appendChild(del); box.appendChild(ed);
}

function openSet() {
  hideAll(); loadCfg(); sel = null;
  showM($("setModal"));
  renderStat(); renderPv(); renderChips(); renderEditor();
}
function refreshUI() {
  if (!$("pickModal").hidden) renderPick();
  if (!$("setModal").hidden) { renderStat(); renderPv(); renderChips(); renderEditor(); }
}
$("openSet").addEventListener("click", openSet);
$("addCustom").addEventListener("click", function () { addBtn($("customKey").value); $("customKey").value = ""; });
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", hideAll); });
document.querySelectorAll(".modal").forEach(function (m) { m.addEventListener("click", function (e) { if (e.target === m) hideAll(); }); });
window.addEventListener("resize", function () { if (!$("setModal").hidden) renderPv(); });
window.addEventListener("focus", function () { if (!$("setModal").hidden) renderStat(); });

function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function fileType(name) {
  var e = (name.split(".").pop() || "").toLowerCase(), d = T[lang];
  return e === "mcworld" ? d.t_world : e === "mcpack" ? d.t_pack : e === "mcaddon" ? d.t_addon : e === "mctemplate" ? d.t_tmpl : d.t_other;
}
function renderLib() {
  var box = $("libList"); if (!box || !N) return;
  var d = T[lang], list = [];
  try { list = JSON.parse(N.libList()); } catch (e) {}
  box.replaceChildren();
  if (!list.length) { box.appendChild(el("div", "empty", d.lib_empty)); return; }
  var wrapb = el("div", "mods");
  list.forEach(function (f) {
    var row = el("div", "fi"), info = el("div", "info");
    info.appendChild(el("h3", null, f.name));
    info.appendChild(el("p", null, fileType(f.name) + "  \u2022  " + fmtSize(f.size)));
    var acts = el("div", "acts");
    var o = el("button", "btn primary", d.lib_open); o.type = "button";
    o.addEventListener("click", function () { try { N.libOpen(f.name); } catch (e) {} });
    var x = el("button", "btn danger", d.lib_del); x.type = "button"; var armed = false;
    x.addEventListener("click", function () {
      if (!armed) { armed = true; x.textContent = d.lib_sure; setTimeout(function () { armed = false; x.textContent = d.lib_del; }, 3000); return; }
      try { N.libDelete(f.name); } catch (e) {}
      renderLib();

    row.appendChild(info); row.appendChild(acts); wrapb.appendChild(row);
  });
  box.appendChild(wrapb);
}
window.libChanged = renderLib;
if (N) {
  $("lib-sec").hidden = false; $("appLib").hidden = false;

var lang = "uz";
try {
  var saved = localStorage.getItem("blokhub-lang");
  if (saved && T[saved]) lang = saved;
  else { var nav = (navigator.language || "uz").slice(0, 2); if (T[nav]) lang = nav; }
} catch (e) {}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render() {
  var d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = d[n.getAttribute("data-t")] || ""; });
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
  });

  var list = document.getElementById("modList");
  list.replaceChildren();
  if (!MODS.length) {
    list.appendChild(el("div", "empty", d.empty));
  } else {
    var box = el("div", "mods");
    MODS.forEach(function (m) {
      var card = el("div", "mod");
      var info = el("div", "info");
      info.appendChild(el("h3", null, m.name));
      var desc = (m.description && typeof m.description === "object") ? m.description[lang] : m.description;
      if (desc) info.appendChild(el("p", null, desc));
      var meta = [m.version, m.mcVersion, m.size].filter(Boolean).join("  \u2022  ");
      if (meta) info.appendChild(el("p", "meta", meta));
      card.appendChild(info);
      var a = el("a", "btn primary", d.dl);
      a.href = m.url; a.target = "_blank"; a.rel = "noopener";
      if (window.BlokHubNative) {
        var acts = el("div", "acts"), sv = el("button", "btn", d.lib_save); sv.type = "button";
        sv.addEventListener("click", function () { try { window.BlokHubNative.libSave(m.url); } catch (e) {} });
        acts.appendChild(sv); acts.appendChild(a); card.appendChild(acts);
      } else card.appendChild(a);
      box.appendChild(card);
    });
    list.appendChild(box);
  }

  var g = document.getElementById("guide");
  g.replaceChildren();
  d.g.forEach(function (item, i) {
    var det = el("details");
    if (i === 0) det.open = true;
    det.appendChild(el("summary", null, item[0]));
    det.appendChild(el("div", "body", item[1]));
    g.appendChild(det);
  });
  if (typeof refreshUI === "function") refreshUI();
  if (typeof renderLib === "function") renderLib();
}

document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () {
    lang = b.getAttribute("data-lang");
    try { localStorage.setItem("blokhub-lang", lang); } catch (e) {}
    render();

});
document.querySelectorAll("[data-scroll]").forEach(function (b) {

  ap.addEventListener("click", openPick);

render();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
