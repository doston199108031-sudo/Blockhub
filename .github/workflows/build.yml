name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Zipni ochish
        run: unzip -q blokhub.zip -d src
      - name: APK yig'ish
        working-directory: src/bedrock-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlokHub-apk
          path: src/bedrock-android/app/build/outputs/apk/debug/app-debug.apk
